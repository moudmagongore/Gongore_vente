org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Désactive le cache incrémental Kotlin — évite les corruptions
# de cache typiques sur volumes externes (/Volumes/...).
kotlin.incremental=false

# Désactive le build cache global pour la même raison.
org.gradle.caching=false

# Active le démon Gradle (par défaut), parallèle, et configuration on-demand.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
